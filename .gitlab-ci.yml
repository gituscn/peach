workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, package, validate, media, build, smoke, publish]

default:
  tags: [docker]

variables:
  GIT_DEPTH: "0"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "60000"
  PEACH_DOWNLOAD_BACKEND: both
  PEACH_R2_BUCKET: peach-releases
  PEACH_R2_PUBLIC_BASE: https://downloads.peach.video

verify-linux:
  stage: verify
  image: node:24-bookworm
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
  cache:
    when: always
    key:
      files: [uv.lock, frontend/package-lock.json]
    paths: [.uv-cache/, .npm/]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3-pip chromium ffmpeg xvfb xauth
    - python3 -m pip install --break-system-packages uv==0.13.3
    - uv sync --locked --all-extras --python 3.14
    - python3 -X utf8 scripts/npm_ci.py --ignore-scripts
    - python3 -X utf8 scripts/npm_ci.py --prefix frontend
    - export PEACH_E2E_CHROME=/usr/bin/chromium
    - test -x "$PEACH_E2E_CHROME"
    - ffmpeg -version
  script:
    - npm run check:vendor
    - npm --prefix frontend run build
    - test -z "$(git status --porcelain --untracked-files=all -- web/dist)"
    - uv run --locked python scripts/npm_audit.py
    - uv run --locked python scripts/npm_audit.py --prefix frontend
    - xvfb-run -a ./scripts/test.sh full --fresh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build/agent-verification/browser/*.tap
      - build/agent-verification/browser/serve.log
      - build/agent-verification/browser/setup-serve.log

verify-windows:
  stage: verify
  tags: [peach-windows]
  # 全量回归连同依赖安装约 20–25 分钟；runner 与本机开发会话共用 CPU，并发全量时会翻倍。
  timeout: 1h 30m
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - '& ./scripts/ci_windows.ps1 verify'
    - if ($LASTEXITCODE -ne 0) { throw 'Windows 全量回归未通过' }

verify-macos:
  stage: verify
  tags: [peach-macos]
  # 全量回归约 3 分钟，冷缓存安装依赖约 15 分钟；依赖下载卡住时提前结束。
  timeout: 45m
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - bash scripts/ci_macos.sh verify arm64

wheel-smoke:
  stage: package
  image: ghcr.io/astral-sh/uv:0.13.3-python3.14-trixie-slim
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - uv lock --check
    - uv build --wheel --out-dir build/wheelhouse
    - uv venv .wheel-smoke --python 3.14
    - uv pip install --python .wheel-smoke/bin/python build/wheelhouse/*.whl
    - uv pip check --python .wheel-smoke/bin/python
    - |
      cd "$(mktemp -d)"
      "$CI_PROJECT_DIR/.wheel-smoke/bin/python" "$CI_PROJECT_DIR/scripts/smoke_wheel.py"
      cd "$CI_PROJECT_DIR"
      sha256sum build/wheelhouse/*.whl > build/wheelhouse/SHA256SUMS.txt
  artifacts:
    expire_in: 14 days
    paths: [build/wheelhouse/]

.release-linux:
  image: ghcr.io/astral-sh/uv:0.13.3-python3.14-trixie-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 ca-certificates git
    - python3 -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
    # 取工具、查发行与下载校验经 peach.peach_proxy 使用 httpx，按锁文件装运行依赖。
    - uv sync --locked --python 3.14
    - export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
    - python3 scripts/fetch_release_tools.py
    - export PATH="$CI_PROJECT_DIR/build/release-tools:$PATH"
    - export GLAB_ENABLE_CI_AUTOLOGIN=true

validate-release:
  extends: .release-linux
  stage: validate
  script:
    - python3 scripts/release_tag.py --gitlab-host "$CI_SERVER_HOST" --repo "$CI_PROJECT_PATH" --verify-sha "$CI_COMMIT_SHA"
    - python3 -c 'import os; from pathlib import Path; from scripts.version_bump import read_version; assert os.environ["CI_COMMIT_TAG"] == "v" + read_version(Path.cwd())'
    - python3 scripts/changelog.py --notes "${CI_COMMIT_TAG#v}" --to build/release-notes.md

windows-media:
  extends: .release-linux
  stage: media
  variables:
    PEACH_SOURCE_CACHE_BASE: "${PEACH_R2_PUBLIC_BASE}/_sources"
  environment:
    name: release
    action: prepare
  script:
    - apt-get install -y build-essential gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-x86-64-dev nasm pkg-config clang meson ninja-build cmake curl xz-utils
    - bash scripts/build_ffmpeg_windows.sh build/ffmpeg-windows
    - bash scripts/build_untrunc_windows.sh build/untrunc-windows
    - python3 scripts/ci_r2_artifacts.py push windows-media
  artifacts:
    expire_in: 14 days
    paths:
      - build/ci-artifacts/windows-media.json

build-windows:
  stage: build
  tags: [peach-windows]
  rules: !reference [.release-linux, rules]
  needs: [windows-media]
  environment:
    name: release
    action: prepare
  before_script:
    - python scripts/fetch_release_tools.py --rclone-only
    - if ($LASTEXITCODE -ne 0) { throw 'R2 传输工具校验失败' }
    - python scripts/ci_r2_artifacts.py pull windows-media
    - if ($LASTEXITCODE -ne 0) { throw '媒体构建产物校验失败' }
  script:
    - '& ./scripts/ci_windows.ps1 build'
    - if ($LASTEXITCODE -ne 0) { throw 'Windows 构建失败' }
    - python scripts/ci_r2_artifacts.py push windows-release
    - if ($LASTEXITCODE -ne 0) { throw 'Windows 产物暂存失败' }
  artifacts:
    expire_in: 14 days
    paths: [build/ci-artifacts/windows-release.json]

build-macos:
  stage: build
  tags: [peach-macos]
  rules: !reference [.release-linux, rules]
  needs: [validate-release]
  environment:
    name: release
    action: prepare
  before_script:
    - python3 scripts/fetch_release_tools.py --rclone-only
  script:
    - bash scripts/ci_macos.sh build arm64
    - bash scripts/ci_macos.sh build x86_64
    - python3 scripts/ci_r2_artifacts.py push macos-release
  artifacts:
    expire_in: 14 days
    paths: [build/ci-artifacts/macos-release.json]

smoke-windows:
  stage: smoke
  tags: [peach-windows]
  rules: !reference [.release-linux, rules]
  needs: [build-windows]
  environment:
    name: release
    action: verify
  before_script:
    - python scripts/fetch_release_tools.py --rclone-only
    - if ($LASTEXITCODE -ne 0) { throw 'R2 传输工具校验失败' }
    - python scripts/ci_r2_artifacts.py pull windows-release
    - if ($LASTEXITCODE -ne 0) { throw 'Windows 产物下载校验失败' }
  script:
    - '& ./release/ci_windows.ps1 smoke'
    - if ($LASTEXITCODE -ne 0) { throw 'Windows 独立制品验收失败' }

publish-docker:
  stage: publish
  tags: [peach-windows]
  rules: !reference [.release-linux, rules]
  needs: [validate-release]
  resource_group: peach-docker-publication
  environment:
    name: release
    action: prepare
  script:
    - '& ./scripts/ci_windows.ps1 docker'
    - if ($LASTEXITCODE -ne 0) { throw 'Docker 镜像发布失败' }

publish-release:
  extends: .release-linux
  stage: publish
  needs: [build-windows, smoke-windows, build-macos]
  resource_group: peach-release-publication
  environment:
    name: release
    url: https://downloads.peach.video
  variables:
    PEACH_R2_BUCKET: peach-releases
    PEACH_R2_PUBLIC_BASE: https://downloads.peach.video
  script:
    - python3 scripts/ci_r2_artifacts.py pull windows-release
    - python3 scripts/ci_r2_artifacts.py pull macos-release
    - cp dist/macos.noindex/arm64/*.dmg dist/macos.noindex/x86_64/*.dmg release/
    - python3 scripts/publish_gitlab_release.py
    - python3 scripts/ci_r2_artifacts.py cleanup
